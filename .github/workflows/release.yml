name: Compile Cross-Platform Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Release Asset
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            spec: windows.spec
            artifact_name: SpatialMediaBatchInjector-${{ github.ref_name }}-Windows.zip
            platform: windows
          - os: ubuntu-latest
            spec: linux.spec
            artifact_name: SpatialMediaBatchInjector-${{ github.ref_name }}-Linux.AppImage
            platform: linux
          - os: macos-latest
            spec: macos.spec
            artifact_name: SpatialMediaBatchInjector-${{ github.ref_name }}-macOS.zip
            platform: macos

    steps:
      - name: Check Out Repository Code Base
        uses: actions/checkout@v4

      - name: Initialize Target Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Python Package Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyqtdarktheme==2.1.0 --ignore-requires-python

      # ==========================================
      # WINDOWS RUN: STANDALONE EXECUTABLE
      # ==========================================
      - name: Compile Windows Executable
        if: matrix.platform == 'windows'
        run: |
          pyinstaller windows.spec
          powershell Compress-Archive -Path dist/SpatialMediaBatchInjector.exe -DestinationPath ${{ matrix.artifact_name }}

      # ==========================================
      # LINUX RUN: CLEAN SYSTEM COMPILATION PASS
      # ==========================================
      - name: Compile Linux Binary Directory
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y binutils
          pyinstaller linux.spec
          
          # Native Python file utility script copy (No absolute host paths required)
          python3 -c "
          import shutil
          from pathlib import Path
          build_dir = Path('dist/SpatialMediaBatchInjector')
          shutil.copy('assets/SpatialMediaBatchInjector.desktop', build_dir / 'SpatialMediaBatchInjector.desktop')
          shutil.copy('assets/icons/app_icon.png', build_dir / 'SpatialMediaBatchInjector.png')
          "

      # STANDARD ACTION RUNNER: Replaces your hacky curl download and manual appimagetool loops entirely!
      - name: Package Universal AppImage Container Natively
        if: matrix.platform == 'linux'
        uses: AppImageCrafters/build-appimage-action@v1
        with:
          recipe: |
            version: 1.0.0
            AppDir:
              path: ./dist/SpatialMediaBatchInjector
              app_info:
                id: SpatialMediaBatchInjector
                name: Spatial Media Batch Injector
                icon: SpatialMediaBatchInjector
                version: 1.0.0
                exec: AppRun
              output: ./SpatialMediaBatchInjector-${{ github.ref_name }}-Linux.AppImage

      # ==========================================
      # MACOS RUN: NATIVE APP BUNDLE
      # ==========================================
      - name: Compile macOS Application Bundle
        if: matrix.platform == 'macos'
        run: |
          pyinstaller macos.spec
          ditto -c -k --sequesterRsrc --keepParent dist/SpatialMediaBatchInjector.app ${{ matrix.artifact_name }}

      # ==========================================
      # AUTOMATED CLOUD DEPLOYMENT BLOCK
      # ==========================================
      - name: Upload Compiled Binary Package to GitHub Release Page
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
